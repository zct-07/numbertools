<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>号码上架/下架工具</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft YaHei";
}

body{
    background:#f5f6fa;
    padding:20px;
}

.container{
    max-width:1300px;
    margin:auto;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

.top{
    display:flex;
    gap:20px;
}

.box{
    flex:1;
}

.box h3{
    margin-bottom:10px;
}

textarea{
    width:100%;
    height:420px;
    resize:none;
    border:1px solid #ccc;
    border-radius:6px;
    padding:10px;
    font-size:15px;
    outline:none;
}

.buttons{
    margin:20px 0;
    text-align:center;
}

button{
    padding:10px 25px;
    margin:0 6px;
    border:none;
    border-radius:5px;
    color:#fff;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    opacity:.9;
}

/* 按钮颜色 */

#format{
    background:#8e44ad;
}

#merge{
    background:#2ecc71;
}

#remove{
    background:#f39c12;
}

#copy{
    background:#3498db;
}

#clear{
    background:#e74c3c;
}

#comma{
    background:#16a085;
}

#semicolon{
    background:#34495e;
}

.result{
    margin-top:20px;
}

.result textarea{
    height:280px;
}

.count{
    margin-top:10px;
    color:#666;
    font-size:15px;
}

</style>

</head>

<body>

<div class="container">

<h2>号码上架 / 下架工具</h2>

<div class="top">

<div class="box">

<h3>原始号码</h3>

<textarea
id="left"
placeholder="支持：换行、英文逗号、英文分号、中文逗号、中文分号">
</textarea>

</div>

<div class="box">

<h3>上架 / 下架号码</h3>

<textarea
id="right"
placeholder="支持：换行、英文逗号、英文分号、中文逗号、中文分号">
</textarea>

</div>

</div>

<div class="buttons">

<button id="format" onclick="formatLeft()">
号码换行
</button>

<button id="merge" onclick="mergeNumbers()">
上架
</button>

<button id="remove" onclick="removeNumbers()">
下架
</button>

<button id="copy" onclick="copyResult()">
复制结果
</button>

<button id="clear" onclick="clearAll()">
清空
</button>

<br><br>

<button id="comma" onclick="formatComma()">
英文逗号 ,
</button>

<button id="semicolon" onclick="formatSemicolon()">
英文分号 ;
</button>

</div>

<div class="result">

<h3>结果</h3>

<textarea
id="result"
readonly>
</textarea>

<div class="count">

左侧：
<span id="leftCount">0</span>

&nbsp;&nbsp;&nbsp;

右侧：
<span id="rightCount">0</span>

&nbsp;&nbsp;&nbsp;

结果：
<span id="resultCount">0</span>

</div>

</div>

</div>

<script>
// 获取号码列表（支持：换行、英文逗号、英文分号、中文逗号、中文分号）
function getList(id){

    return [...new Set(
        document.getElementById(id).value
            .replace(/[;,，；]/g,"\n")
            .split(/\r?\n/)
            .map(v=>v.trim())
            .filter(v=>v!=="")
    )];

}


// 左侧号码换行
function formatLeft(){

    let list = getList("left");

    document.getElementById("left").value = list.join("\n");

    updateCount();

}


// 更新统计
function updateCount(){

    document.getElementById("leftCount").innerText =
        getList("left").length;

    document.getElementById("rightCount").innerText =
        getList("right").length;

    document.getElementById("resultCount").innerText =
        getList("result").length;

}


// 上架（并集）
function mergeNumbers(){

    let left = getList("left");

    let right = getList("right");

    let result = [...new Set([...left,...right])];

    document.getElementById("result").value =
        result.join("\n");

    updateCount();

}


// 下架（删除相同号码）
function removeNumbers(){

    let left = getList("left");

    let right = getList("right");

    let leftSet = new Set(left);

    let rightSet = new Set(right);

    let result = [];

    left.forEach(item=>{

        if(!rightSet.has(item)){

            result.push(item);

        }

    });

    right.forEach(item=>{

        if(!leftSet.has(item)){

            result.push(item);

        }

    });

    document.getElementById("result").value =
        result.join("\n");

    updateCount();

}


// 转英文逗号
function formatComma(){

    let list = getList("result");

    document.getElementById("result").value =
        list.join(",");

}


// 转英文分号
function formatSemicolon(){

    let list = getList("result");

    document.getElementById("result").value =
        list.join(";");

}


// 复制结果（不弹提示）
function copyResult(){

    let text = document.getElementById("result").value;

    if(text==="") return;

    navigator.clipboard.writeText(text);

}


// 清空
function clearAll(){

    document.getElementById("left").value="";

    document.getElementById("right").value="";

    document.getElementById("result").value="";

    updateCount();

}


// 实时统计
document.getElementById("left")
.addEventListener("input",updateCount);

document.getElementById("right")
.addEventListener("input",updateCount);

updateCount();

</script>

</body>
</html>
