<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>号码对比工具</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft YaHei";
}

body{
    background:#f5f6fa;
    padding:20px;
}

.container{
    max-width:1300px;
    margin:auto;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

.top{
    display:flex;
    gap:20px;
}

.box{
    flex:1;
}

.box h3{
    margin-bottom:10px;
}

textarea{
    width:100%;
    height:420px;
    resize:none;
    border:1px solid #ccc;
    border-radius:6px;
    padding:10px;
    font-size:15px;
    outline:none;
}

.buttons{
    margin:20px 0;
    text-align:center;
}

button{
    padding:10px 25px;
    margin:0 8px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
    font-size:15px;
}

#merge{
    background:#2ecc71;
}

#remove{
    background:#e67e22;
}

#copy{
    background:#3498db;
}

#clear{
    background:#e74c3c;
}

.result{
    margin-top:20px;
}

.result textarea{
    height:300px;
}

.count{
    margin-top:10px;
    font-size:15px;
    color:#666;
}
</style>

</head>
<body>

<div class="container">

<h2>号码上架 / 下架工具</h2>

<div class="top">

<div class="box">
<h3>原始号码</h3>
<textarea id="left" placeholder="每行一个号码"></textarea>
</div>

<div class="box">
<h3>上架 / 下架号码</h3>
<textarea id="right" placeholder="每行一个号码"></textarea>
</div>

</div>

<div class="buttons">

<button id="merge" onclick="mergeNumbers()">上架</button>

<button id="remove" onclick="removeNumbers()">下架</button>

<button id="copy" onclick="copyResult()">复制结果</button>

<button id="clear" onclick="clearAll()">清空</button>

</div>

<div class="result">

<h3>结果</h3>

<textarea id="result" readonly></textarea>

<div class="count">
左侧：<span id="leftCount">0</span>　
右侧：<span id="rightCount">0</span>　
结果：<span id="resultCount">0</span>
</div>

</div>

</div>

<script>

function getList(id){

    return [...new Set(
        document.getElementById(id).value
        .split(/\r?\n/)
        .map(v=>v.trim())
        .filter(v=>v!=="")
    )];

}

function updateCount(){

    document.getElementById("leftCount").innerText=getList("left").length;

    document.getElementById("rightCount").innerText=getList("right").length;

    document.getElementById("resultCount").innerText=getList("result").length;

}

function mergeNumbers(){

    let left=getList("left");

    let right=getList("right");

    let result=[...new Set([...left,...right])];

    document.getElementById("result").value=result.join("\n");

    updateCount();

}

function removeNumbers(){

    let left=getList("left");

    let right=getList("right");

    let leftSet=new Set(left);

    let rightSet=new Set(right);

    let result=[];

    left.forEach(item=>{
        if(!rightSet.has(item)){
            result.push(item);
        }
    });

    right.forEach(item=>{
        if(!leftSet.has(item)){
            result.push(item);
        }
    });

    document.getElementById("result").value=result.join("\n");

    updateCount();

}

function copyResult(){

    let txt=document.getElementById("result");

    txt.select();

    document.execCommand("copy");

    alert("复制成功！");

}

function clearAll(){

    document.getElementById("left").value="";

    document.getElementById("right").value="";

    document.getElementById("result").value="";

    updateCount();

}

document.getElementById("left").addEventListener("input",updateCount);
document.getElementById("right").addEventListener("input",updateCount);

updateCount();

</script>

</body>
</html>
